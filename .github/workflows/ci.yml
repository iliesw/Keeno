name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # Tests and typechecking run against package sources (root tsconfig `paths`), before any build.
      - name: Test
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit -p .

      - name: Build packages
        run: bun run build

      - name: Build examples
        run: |
          bun run --cwd examples/todo build
          bun run --cwd examples/counter build
