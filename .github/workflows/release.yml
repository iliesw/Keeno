name: Release

# On every push to main: if there are changesets, open (or update) a "Version packages" pull
# request; once that is merged, publish every package whose version isn't on npm yet.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # tags, releases and the version PR branch
  pull-requests: write # the version PR
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Provenance and trusted publishing need a recent npm.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Create the version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
